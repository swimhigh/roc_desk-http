[package]
name = "roc_desk_http"
version = "0.2.0"
edition = "2021"

[features]
default = ["business"]
# 集合/请求/环境/发送请求的核心业务逻辑（YAML 落盘 + reqwest 发送），以及自带的
# SQLite 请求历史/标签页存储。standalone 壳和宿主都需要这个 feature；只在极少数
# "只要类型定义/curl 解析" 的场景下才会关掉。
business = ["dep:rusqlite", "dep:r2d2"]

[dependencies]
roc_desk_core = { git = "https://github.com/swimhigh/roc_desk-common", package = "roc_desk_core", tag = "common-v0.10.0" }
roc_desk_common = { git = "https://github.com/swimhigh/roc_desk-common", package = "roc_desk_common", tag = "common-v0.10.0" }
tauri = { version = "2" }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread"] }
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
r2d2 = { version = "0.8", optional = true }
