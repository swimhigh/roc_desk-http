[package]
name = "roc_desk_http_standalone"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
roc_desk_http = { path = "../lib" }
tauri = { version = "2", features = ["wry"] }

serde_json = "1"
[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
